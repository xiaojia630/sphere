[package]
name = "sphere-app"
description = "The Sphere desktop app: a 3D command center for coding agents, with code review, git, containers, ports, system and files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "sphere-app"
path = "src/main.rs"

[dependencies]
# Only what the app uses: no glTF, scenes, gizmos, animation or audio (sounds play through rodio on their own
# thread), and X11 only on Linux.
bevy = { version = "=0.20.0", default-features = false, features = [
  "default_app", "std", "multi_threaded", "bevy_winit", "default_font", "png", "hdr", "smaa_luts", "zstd_rust",
  "bevy_render", "bevy_core_pipeline", "bevy_anti_alias", "bevy_post_process", "bevy_pbr", "bevy_light",
  "bevy_camera", "bevy_color", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_material", "bevy_window",
  "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_input_focus",
] }
# the terminal emulator; the web build patches out its PTY half (scripts/build-web.sh)
alacritty_terminal = "=0.26.0"
fontdue = "=0.9.4"
sphere-proto.workspace = true
serde_json.workspace = true
# Instant and SystemTime that also work in a browser (the std ones there panic); on a computer these are std's own
web-time = "=1.1.0"

# Everything that needs the computer: terminals, the service, voice and sounds. The web playground
# (`scripts/build-web.sh`) runs the app's demo with none of it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
portable-pty = "=0.9.0"
rodio = { version = "=0.22.2", default-features = false, features = ["playback"] }
hound = "=3.5.1"
sphere-client.workspace = true
sphere-host.workspace = true
sphere-voice.workspace = true
tokio.workspace = true
libc.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["web", "webgpu"] }
js-sys = "=0.3.106"
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "Location", "Document", "Element", "HtmlElement"] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "=0.9.0"
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSRunningApplication", "NSColor", "NSColorSpace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSBundle", "NSError", "NSSet", "NSArray", "NSDictionary", "NSObject"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationResponse"] }
block2 = "=0.6.2"
# the home's Next 24h rail: Calendar events through EventKit
objc2-event-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKTypes"] }

[features]
# Linux Wayland sessions: build with `--features wayland` (needs libwayland-dev).
wayland = ["bevy/wayland"]
