[package]
name = "sphere-voice"
description = "Sphere's spoken voice: Kokoro-82M (bm_george) through ONNX Runtime, with misaki's British lexicons for phonemes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
