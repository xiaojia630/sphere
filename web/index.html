<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sphere OS</title>
<style>
  html, body { margin: 0; height: 100%; background: #03070d; overflow: hidden; }
  #sphere { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #5fd4ff;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .2em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sphere"></canvas>
<div id="loading">STARTING SPHERE OS…</div>
<script type="module">
  import init from "./pkg/sphere_os.js";
  init().catch((e) => {
    document.getElementById("loading").textContent = "Could not start: " + e;
    throw e;
  });
</script>
</body>
</html>
