[package]
name = "sphere-os"
version = "0.2.0"
edition = "2021"
description = "An agent-first desktop: a living core, windows, docks and an agent feed."
license = "Apache-2.0"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "=0.31.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "Node", "HtmlCanvasElement"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

# Smaller binaries for the browser build.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
